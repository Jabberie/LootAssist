name: Build GitHub Release

on:
  workflow_dispatch:

  push:
    tags:
      - '*_release'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get release version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG%_release}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build addon package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          mkdir -p package/LootAssist

          rsync -av ./ package/LootAssist/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='package' \
            --exclude='*.zip'

          sed -i "s/@project-version@/$VERSION/g" \
            package/LootAssist/LootAssist.toc

          cd package
          zip -r "../LootAssist-${VERSION}.zip" LootAssist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LootAssist ${{ steps.version.outputs.version }}
          files: LootAssist-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true